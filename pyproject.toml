[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "secsgem-sim"
version = "0.1.0"
description = "A from-scratch SECS-II / HSMS / GEM equipment simulator and host client in pure Python asyncio"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Bhawesh Bhaskar" }]
keywords = ["secs", "gem", "hsms", "semiconductor", "factory-automation", "asyncio"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Framework :: AsyncIO",
    "Topic :: Scientific/Engineering",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
secsgem-sim = "secsgem_sim.cli:main"

[tool.setuptools]
packages = ["secsgem_sim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
